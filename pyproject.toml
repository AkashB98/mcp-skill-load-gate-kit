[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-skill-load-gate-kit"
version = "0.1.0"
description = "Load-time vetting gate for skills delivered by MCP servers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
packages = ["mcp_skill_gate"]
